<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>设备管理</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));background:#f4f6f5;color:#111827;font:14px system-ui,"Microsoft YaHei",sans-serif}.panel{width:min(360px,100%);padding:26px;border:1px solid #d9dfdc;border-radius:12px;background:#fff}.mark{width:44px;height:44px;display:grid;place-items:center;margin-bottom:22px;border-radius:12px;background:#111827;color:#22c55e;font-size:20px;font-weight:800}.panel h1{margin:0 0 8px;font-size:21px}.panel p{margin:0;color:#64748b;line-height:1.6}
    </style>
  </head>
  <body><main class="panel"><div class="mark">●</div><h1>当前离线</h1><p>网络恢复后重新打开设备管理。</p></main></body>
</html>
