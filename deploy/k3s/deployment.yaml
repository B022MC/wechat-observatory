apiVersion: apps/v1
kind: Deployment
metadata:
  name: wechat-observatory
  namespace: wechat-observatory
  labels:
    app: wechat-observatory
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: wechat-observatory
  template:
    metadata:
      labels:
        app: wechat-observatory
    spec:
      containers:
        - name: bridge
          image: registry.example.internal/pd/wechat-observatory:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wechat-observatory-config
            - secretRef:
                name: wechat-observatory-secrets
          ports:
            - name: http
              containerPort: 8088
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
