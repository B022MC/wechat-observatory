x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}"
      TZ: "${TZ:-Asia/Shanghai}"
      OBS_DB_NAME: "${OBS_DB_NAME:-wechat_observatory}"
      OBS_DB_USER: "${OBS_DB_USER:?set OBS_DB_USER}"
      OBS_DB_PASSWORD: "${OBS_DB_PASSWORD:?set OBS_DB_PASSWORD}"
      GATEWAY_DB_NAME: "${GATEWAY_DB_NAME:-pd_wechat_gateway}"
      GATEWAY_DB_USER: "${GATEWAY_DB_USER:?set GATEWAY_DB_USER}"
      GATEWAY_DB_PASSWORD: "${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=60
      - --table-open-cache=400
      - --binlog-expire-logs-seconds=604800
      - --binlog-transaction-compression=ON
    logging: *default-logging
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  observatory-db:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: wechat-observatory:local
    restart: "no"
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BRIDGE_ADMIN_PASSWORD: "${BRIDGE_ADMIN_PASSWORD:?set BRIDGE_ADMIN_PASSWORD}"
      BRIDGE_DEFAULT_DEVICE: "${BRIDGE_DEFAULT_DEVICE:-phone-a}"
      BRIDGE_DEVICES: "${BRIDGE_DEVICES:-phone-a||wechat-phone|5s}"
      BRIDGE_API_KEYS: "${BRIDGE_API_KEYS:-}"
      BRIDGE_MYSQL_DSN: "${OBS_DB_USER:?set OBS_DB_USER}:${OBS_DB_PASSWORD:?set OBS_DB_PASSWORD}@tcp(mysql:3306)/${OBS_DB_NAME:-wechat_observatory}?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27"
    entrypoint: ["/usr/local/bin/wechat-observatory-db"]
    command: ["-create-database", "-migrate", "-seed", "-check"]
    logging: *default-logging

  observatory:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: wechat-observatory:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      observatory-db:
        condition: service_completed_successfully
    environment:
      BRIDGE_HTTP_ADDR: ":8088"
      BRIDGE_ADMIN_PASSWORD: "${BRIDGE_ADMIN_PASSWORD:?set BRIDGE_ADMIN_PASSWORD}"
      BRIDGE_DEVICE_ADMIN_PASSWORD: "${BRIDGE_DEVICE_ADMIN_PASSWORD:-}"
      BRIDGE_DEFAULT_DEVICE: "${BRIDGE_DEFAULT_DEVICE:-phone-a}"
      BRIDGE_DEVICES: "${BRIDGE_DEVICES:-phone-a||wechat-phone|5s}"
      BRIDGE_API_KEYS: "${BRIDGE_API_KEYS:-}"
      BRIDGE_MYSQL_DSN: "${OBS_DB_USER:?set OBS_DB_USER}:${OBS_DB_PASSWORD:?set OBS_DB_PASSWORD}@tcp(mysql:3306)/${OBS_DB_NAME:-wechat_observatory}?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai&time_zone=%27%2B08%3A00%27"
      BRIDGE_MYSQL_AUTO_MIGRATE: "false"
      BRIDGE_OUTBOX_POLL_INTERVAL: "${BRIDGE_OUTBOX_POLL_INTERVAL:-3s}"
      BRIDGE_HISTORY_RETENTION_DAYS: "${BRIDGE_HISTORY_RETENTION_DAYS:-15}"
      BRIDGE_HISTORY_RETENTION_INTERVAL: "${BRIDGE_HISTORY_RETENTION_INTERVAL:-1h}"
      BRIDGE_MODULE_OFFLINE_AFTER: "${BRIDGE_MODULE_OFFLINE_AFTER:-5m}"
      BRIDGE_OFFLINE_OUTBOX_SWEEP_INTERVAL: "${BRIDGE_OFFLINE_OUTBOX_SWEEP_INTERVAL:-30s}"
    logging: *default-logging
    ports:
      # Caddy reaches Observatory over the runtime network.
      - "127.0.0.1:${BRIDGE_HTTP_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway-db:
    build:
      context: ../../../pd-wechat-gateway
      dockerfile: Dockerfile
    image: pd-wechat-gateway:local
    restart: "no"
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
    environment: &gateway-env
      PD_GATEWAY_DB_DRIVER: mysql
      PD_GATEWAY_DB: "${GATEWAY_DB_USER:?set GATEWAY_DB_USER}:${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD}@tcp(mysql:3306)/${GATEWAY_DB_NAME:-pd_wechat_gateway}?charset=utf8mb4&parseTime=true&loc=UTC"
      PD_GATEWAY_RUNTIME_MODE: standalone
      PD_GATEWAY_RUNTIME_ROLE: all
      PD_GATEWAY_ADDR: ":19090"
      PD_GATEWAY_ADMIN_DIST: /app/web/admin/dist
      PD_GATEWAY_SUPER_USERNAME: "${PD_GATEWAY_SUPER_USERNAME:-admin}"
      PD_GATEWAY_SUPER_PASSWORD: "${PD_GATEWAY_SUPER_PASSWORD:?set PD_GATEWAY_SUPER_PASSWORD}"
      PD_GATEWAY_SUPER_DISPLAY_NAME: "${PD_GATEWAY_SUPER_DISPLAY_NAME:-Super Admin}"
    entrypoint: ["/usr/local/bin/pd-wechat-gateway-db"]
    logging: *default-logging

  gateway:
    build:
      context: ../../../pd-wechat-gateway
      dockerfile: Dockerfile
    image: pd-wechat-gateway:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      observatory:
        condition: service_healthy
      gateway-db:
        condition: service_completed_successfully
    environment:
      <<: *gateway-env
      PD_GATEWAY_GAME_RUNTIME_ENABLED: "${PD_GATEWAY_GAME_RUNTIME_ENABLED:-false}"
      PD_GATEWAY_RUNTIME_TEAHOUSE_ID: "${PD_GATEWAY_RUNTIME_TEAHOUSE_ID:-}"
      PD_GATEWAY_PLAYER_CONTROLS_ENABLED: "${PD_GATEWAY_PLAYER_CONTROLS_ENABLED:-false}"
      PD_GATEWAY_NATIVE_COMMANDS_ENABLED: "${PD_GATEWAY_NATIVE_COMMANDS_ENABLED:-false}"
      PD_GATEWAY_NATIVE_COMMAND_HOUSE_GIDS: "${PD_GATEWAY_NATIVE_COMMAND_HOUSE_GIDS:-}"
      PD_GATEWAY_NATIVE_HOUSE_USER_GIDS: "${PD_GATEWAY_NATIVE_HOUSE_USER_GIDS:-}"
      PD_GATEWAY_ALL_COMMANDS_ENABLED: "${PD_GATEWAY_ALL_COMMANDS_ENABLED:-false}"
      PD_GATEWAY_WEALTH_ENABLED: "${PD_GATEWAY_WEALTH_ENABLED:-false}"
      PD_GATEWAY_WEALTH_HOUSE_GIDS: "${PD_GATEWAY_WEALTH_HOUSE_GIDS:-}"
      PD_GATEWAY_PROJECTION_TOKEN: "${PD_GATEWAY_PROJECTION_TOKEN:-}"
      PD_GATEWAY_BOSS_BIND_TOKEN: "${PD_GATEWAY_BOSS_BIND_TOKEN:-}"
      PD_GATEWAY_PUBLIC_BASE_URL: "${PD_GATEWAY_PUBLIC_BASE_URL:-}"
      PD_GATEWAY_BOSS_APP_ENABLED: "${PD_GATEWAY_BOSS_APP_ENABLED:-false}"
      PD_GATEWAY_BOSS_DIST: "${PD_GATEWAY_BOSS_DIST:-/app/web/boss/dist}"
      PD_GATEWAY_BOSS_COOKIE_SECURE: "${PD_GATEWAY_BOSS_COOKIE_SECURE:-true}"
      PD_GATEWAY_BOSS_KEY_PEPPER: "${PD_GATEWAY_BOSS_KEY_PEPPER:-}"
      PD_GATEWAY_BOSS_PUSH_ENABLED: "${PD_GATEWAY_BOSS_PUSH_ENABLED:-false}"
      PD_GATEWAY_BOSS_PUSH_VAPID_PUBLIC: "${PD_GATEWAY_BOSS_PUSH_VAPID_PUBLIC:-}"
      PD_GATEWAY_BOSS_PUSH_VAPID_PRIVATE: "${PD_GATEWAY_BOSS_PUSH_VAPID_PRIVATE:-}"
      PD_GATEWAY_BOSS_PUSH_VAPID_SUBJECT: "${PD_GATEWAY_BOSS_PUSH_VAPID_SUBJECT:-}"
      PD_GATEWAY_HISTORY_RETENTION_DAYS: "${PD_GATEWAY_HISTORY_RETENTION_DAYS:-15}"
      PD_GATEWAY_HISTORY_RETENTION_INTERVAL: "${PD_GATEWAY_HISTORY_RETENTION_INTERVAL:-1h}"
      PD_GATEWAY_RESOURCE_ALERTS_ENABLED: "${PD_GATEWAY_RESOURCE_ALERTS_ENABLED:-true}"
      PD_GATEWAY_RESOURCE_ALERT_INTERVAL: "${PD_GATEWAY_RESOURCE_ALERT_INTERVAL:-5m}"
      PD_GATEWAY_RESOURCE_ALERT_COOLDOWN: "${PD_GATEWAY_RESOURCE_ALERT_COOLDOWN:-6h}"
      PD_GATEWAY_DATABASE_ALERT_BYTES: "${PD_GATEWAY_DATABASE_ALERT_BYTES:-5368709120}"
      PD_GATEWAY_BINLOG_ALERT_BYTES: "${PD_GATEWAY_BINLOG_ALERT_BYTES:-4294967296}"
      PD_GATEWAY_DISK_ALERT_PERCENT: "${PD_GATEWAY_DISK_ALERT_PERCENT:-85}"
      PD_GATEWAY_MEMORY_ALERT_PERCENT: "${PD_GATEWAY_MEMORY_ALERT_PERCENT:-85}"
    logging: *default-logging
    ports:
      - "127.0.0.1:${PD_GATEWAY_HTTP_PORT:-19090}:19090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:19090/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql-data:
