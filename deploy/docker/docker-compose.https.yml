x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PD_WECHAT_HTTPS_HOST: "${PD_WECHAT_HTTPS_HOST:?set PD_WECHAT_HTTPS_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  runtime:
    external: true
    name: "${PD_WECHAT_RUNTIME_NETWORK:-pd-wechat-runtime_default}"

volumes:
  caddy-data:
  caddy-config:
