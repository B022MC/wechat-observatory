plugins {
    id "com.android.application"
}

android {
    namespace "cc.wechat.observatory"
    compileSdk 35

    defaultConfig {
        applicationId "cc.wechat.observatory"
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName "0.1.12-multi-phone"
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
    testImplementation "junit:junit:4.13.2"
}
